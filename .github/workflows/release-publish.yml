name: Release Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        # The reusable workflow this job consumes
        # (nolte/gh-plumbing reusable-release-publish.yml) declares `tag` as
        # required and owns the draft-resolve / multi-draft-guard logic. Per
        # spec/project/release-automation/ §Operational contract the input is
        # conceptually optional with a resolve path, but that resolution lives
        # in the reusable, not here; keeping this passthrough required matches
        # the reusable's contract (passing an empty tag would fail its
        # Resolve-draft step).
        description: "Draft tag to publish. Must match an existing release-drafter draft."
        required: true
        type: string
      dry_run:
        description: "Validate only; do not flip draft -> published."
        required: false
        default: false
        type: boolean

# spec/project/github-actions-best-practices/ §B: read-only at the workflow level.
# `license-verdict` only reads the checkout; the `contents: write` the publish
# needs is granted on the `publish` job alone.
permissions:
  contents: read

# spec/project/release-automation/ §Workflow existence and trigger SHOULD: two
# overlapping dispatches must queue rather than race on the `--draft=false` API
# call, so `cancel-in-progress` stays false — cancelling a half-finished publish
# is worse than serialising.
#
# Per spec/project/github-actions-best-practices/ §F, the group is the shared
# literal `release-draft`, naming the resource rather than this workflow. The open
# release draft has two writers — `release-drafter.yml` rewrites its body, this
# workflow flips it to published — and the platform matches concurrency groups by
# string equality across the repository, so an equal literal in both files is what
# puts them in one lane. Keying on this workflow instead would leave a drafter run
# free to move `target_commitish` between this workflow's `gh release edit
# --target` and its `--draft=false` flip.
#
# The rename also retires a nested identical group: `reusable-release-publish.yml`
# at the pinned digest declares `release-publish` for itself, and the caller
# previously declared the same string. Nested identical groups are a documented
# deadlock shape. The callee still serialises publishes against each other under
# its own group, so nothing is lost by naming the caller's lane after the resource
# it actually shares.
#
# `cancel-in-progress` stays false: two overlapping dispatches must queue rather
# than race on the `--draft=false` call, and cancelling a half-finished publish is
# worse than serialising. GitHub still supersedes a *pending* run the moment a
# newer one queues into the group, so a dispatch made while the lane is busy can
# be dropped as `cancelled` and has to be re-dispatched. That consequence is
# accepted, not argued away — and it is not self-announcing:
# `skills/release-publish-trigger/` treats a landed dispatch as the end of its
# job and does not follow the run, so today the drop is silent. Tracked as a
# follow-up against that skill.
#
# §F's second rule wants the workflow identity plus a branch identity in the key.
# This group carries neither, deliberately — see the §Open Questions entry on
# resource-scoped groups.
concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  # Pre-publish gate per spec/project/license-check/ §Triggers, cadence, and
  # CI: a full check is required before every release tag, so the publish is
  # refused while the latest persisted license-check verdict isn't `Pass`
  # (2026-Q3 audit finding license-check.ci-cadence-unwired, #496).
  license-verdict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Latest license-check record must carry verdict Pass
        run: |
          latest=$(ls .audits/license-check/license-*.md 2>/dev/null | sort | tail -1)
          if [ -z "$latest" ]; then
            echo "::error::No license-check record under .audits/license-check/ — run the license-check skill before publishing."
            exit 1
          fi
          echo "Latest record: $latest"
          if ! awk '/^## Verdict/{f=1;next} f && NF {print; exit}' "$latest" | grep -q '^\*\*Pass'; then
            echo "::error::Latest license-check verdict in $latest is not Pass — resolve findings and re-run the license-check skill before publishing."
            exit 1
          fi

  publish:
    needs: license-verdict
    permissions:
      contents: write
    uses: nolte/gh-plumbing/.github/workflows/reusable-release-publish.yml@80cb5ebb91a3b49126729de31b1037f11c34b5cd # v2.2.0
    with:
      tag: ${{ inputs.tag }}
      dry_run: ${{ inputs.dry_run }}
      app-id: ${{ vars.PORTFOLIO_APP_ID }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
      app-private-key: ${{ secrets.PORTFOLIO_APP_PRIVATE_KEY }}
