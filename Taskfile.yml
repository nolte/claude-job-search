# https://taskfile.dev

version: '3'

vars:
  # Pinned to an immutable commit of nolte/taskfiles, never a moving branch. The commit
  # carries mkdocs:build and the overridable module variables.
  TASK_COLLECTION_BASE: https://raw.githubusercontent.com/nolte/taskfiles/946069adc1759a0b7d8e559e49bf79b6f6d0d0ce/src
  VENV: .venv

includes:
  mkdocs:
    taskfile: "{{.TASK_COLLECTION_BASE}}/taskfile-include-mkdocs.yaml"
    vars:
      PYTHON_VENV_DIR_DOCS: "{{.ROOT_DIR}}/{{.VENV}}"

tasks:
  default:
    cmds:
      - task -l
    silent: true

  install:
    desc: Create the project-local .venv and install the docs dependencies
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.VENV}}/bin/python -m pip install --upgrade pip"
      - "{{.VENV}}/bin/python -m pip install -r docs/requirements.txt"

  lint:
    desc: Run pre-commit across all files
    cmds:
      - pre-commit run --all-files

  test:
    desc: Run the test suite (CV checks, export, skill structure)
    cmds:
      - python3 -m unittest discover -s tests -v

  docs:
    desc: Build the MkDocs site, failing on any warning (shared module mkdocs:build)
    cmds:
      - task: mkdocs:build

  docs:serve:
    desc: Serve the MkDocs site locally with live reload (shared module mkdocs:start)
    cmds:
      - task: mkdocs:start

  export:
    desc: |
      Export one Bewerbungsdokument from its Markdown source to pdf (LaTeX), docx, html, or md.
      Usage: task export -- <input.md> --format <pdf|docx|html|md|tex> --doc-type <cv|letter|motivation|email> [--out-dir DIR] [--name NAME]
      The doc type email exports only as md. Exit codes: 0 ok, 1 error, 2 content differs, 3 --reproduce differs, 4 page limit exceeded.
        task export -- job-application/acme/lebenslauf.md --format pdf --doc-type cv
        task export -- job-application/acme/anschreiben.md --format docx --doc-type letter --name Max_Mustermann_Anschreiben
      Rebuild an export from its manifest and compare it: task export -- --reproduce <datei>.manifest.json
    cmds:
      - python3 skills/job-application-export/scripts/export_document.py {{.CLI_ARGS}}

  eval:
    desc: |
      Run the model-in-the-loop evals (costs money, uses your credentials; see docs/en/evals.md).
      Usage: task eval -- <trigger|behavior|all|case-glob>   (env: MODEL, JUDGE, MAX_COST_USD, THRESHOLD, RUNS, ABLATION, TRUST)
    cmds:
      - evals/run.sh {{.CLI_ARGS}}

  eval:container:
    desc: |
      Run the evals inside a container in which the sandbox of the Bash tool can work (docs/en/evals.md, "Running in a container").
      Usage: task eval:container -- <case-glob>   (same arguments and env as `task eval`; needs docker)
    cmds:
      - evals/docker/run.sh {{.CLI_ARGS}}

  workflow:
    desc: |
      Workflow orchestration of the application process (spec workflow WF-1 to WF-14): tasks, dependencies, approvals.
      Usage: task workflow -- <starten|laufen|naechste|uebersicht|freigeben|...> ...   (executes no skill and sends nothing)
    cmds:
      - python3 scripts/workflow.py {{.CLI_ARGS}}

  quality:
    desc: |
      Quality report of one Vorgang (spec qualitaetssicherung QS-1 to QS-12): deterministic checks, export checks and the semantic verdicts.
      Usage: task quality -- <pruefen|status|entscheiden|katalog> <vorgang-ordner> ...   (writes qualitaet.json; sends and approves nothing)
    cmds:
      - python3 scripts/qualitaet.py {{.CLI_ARGS}}

  search:
    desc: |
      Deterministic helper of the recurring job search (spec stellensuche ST-13 to ST-20).
      Usage: task search -- [--konfiguration job-application/konfiguration.md] <anlegen|pruefen|freigeben|faellig|warteschlange|...> ...
    cmds:
      - python3 scripts/stellensuche.py {{.CLI_ARGS}}

  search:scheduled:
    desc: |
      Start one headless Claude Code session per due Suchauftrag (needs `claude` and the JobSpy MCP server; costs tokens).
      Usage: task search:scheduled -- job-application/konfiguration.md   (call it from your own cron or timer)
    cmds:
      - scripts/stellensuche_geplant.sh {{.CLI_ARGS}}

  plugin:reload:
    desc: Start Claude Code with this repo loaded as a plugin (dogfooding)
    cmds:
      - claude --plugin-dir .

  worktree:add:
    desc: |
      Create a parallel working copy under ${NOLTE_WORKTREE_ROOT:-~/repos/.worktrees}/<repo>/<slug>/,
      branched off origin/develop, and seed a .resume/<slug>/plan.md plan stub.
      Usage: task worktree:add -- <branch> [slug]
        task worktree:add -- feat/parser-fix
        task worktree:add -- chore/ci-tidy ci
    cmds:
      - ./scripts/worktree_add.sh {{.CLI_ARGS}}
