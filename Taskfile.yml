# https://taskfile.dev

version: '3'

tasks:
  default:
    cmds:
      - task -l
    silent: true

  lint:
    desc: Run pre-commit across all files
    cmds:
      - pre-commit run --all-files

  test:
    desc: Run the test suite (placeholder — no runtime tests yet)
    cmds:
      - echo "no tests yet"
    silent: true

  docs:
    desc: Build the MkDocs site
    cmds:
      - mkdocs build --strict

  plugin:reload:
    desc: Start Claude Code with this repo loaded as a plugin (dogfooding)
    cmds:
      - claude --plugin-dir .
