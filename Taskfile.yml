# https://taskfile.dev

version: '3'

vars:
  # Pinned to an immutable commit of nolte/taskfiles, never a moving branch. The commit
  # carries mkdocs:build and the overridable module variables.
  TASK_COLLECTION_BASE: https://raw.githubusercontent.com/nolte/taskfiles/946069adc1759a0b7d8e559e49bf79b6f6d0d0ce/src
  VENV: .venv

includes:
  mkdocs:
    taskfile: "{{.TASK_COLLECTION_BASE}}/taskfile-include-mkdocs.yaml"
    vars:
      PYTHON_VENV_DIR_DOCS: "{{.ROOT_DIR}}/{{.VENV}}"

tasks:
  default:
    cmds:
      - task -l
    silent: true

  install:
    desc: Create the project-local .venv and install the docs dependencies
    cmds:
      - python3 -m venv {{.VENV}}
      - "{{.VENV}}/bin/python -m pip install --upgrade pip"
      - "{{.VENV}}/bin/python -m pip install -r docs/requirements.txt"

  lint:
    desc: Run pre-commit across all files
    cmds:
      - pre-commit run --all-files

  test:
    desc: Run the test suite (CV checks, export, skill structure)
    cmds:
      - python3 -m unittest discover -s tests -v

  docs:
    desc: Build the MkDocs site, failing on any warning (shared module mkdocs:build)
    cmds:
      - task: mkdocs:build

  docs:serve:
    desc: Serve the MkDocs site locally with live reload (shared module mkdocs:start)
    cmds:
      - task: mkdocs:start

  export:
    desc: |
      Export one Bewerbungsdokument from its Markdown source to pdf (LaTeX), docx, html, or md.
      Usage: task export -- <input.md> --format <pdf|docx|html|md|tex> --doc-type <cv|letter|motivation|email> [--out-dir DIR] [--name NAME]
      The doc type email exports only as md. Exit codes: 0 ok, 1 error, 2 content differs, 3 --reproduce differs, 4 page limit exceeded.
        task export -- job-application/acme/lebenslauf.md --format pdf --doc-type cv
        task export -- job-application/acme/anschreiben.md --format docx --doc-type letter --name Max_Mustermann_Anschreiben
      Rebuild an export from its manifest and compare it: task export -- --reproduce <datei>.manifest.json
    cmds:
      - python3 skills/job-application-export/scripts/export_document.py {{.CLI_ARGS}}

  plugin:reload:
    desc: Start Claude Code with this repo loaded as a plugin (dogfooding)
    cmds:
      - claude --plugin-dir .
