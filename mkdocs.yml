site_name: claude-job-search
site_url: https://nolte.github.io/claude-job-search/
site_description: Claude Code skills for German-speaking job applications (Bewerbungsunterlagen) — packaged as the claude-job-search plugin.
site_author: nolte

repo_url: https://github.com/nolte/claude-job-search
repo_name: nolte/claude-job-search
edit_uri: edit/main/docs/

copyright: Copyright &copy; 2026 nolte

docs_dir: docs

theme:
  name: material
  language: en

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-7
        name: Zum Dunkelmodus wechseln
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/brightness-4
        name: Zum Hellmodus wechseln

  features:
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang:
        - en
        - de
  - i18n:
      docs_structure: folder
      fallback_to_default: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: de
          name: Deutsch
          build: true
          nav_translations:
            Home: Startseite
            Getting started: Erste Schritte
            Use cases: Anwendungsfälle
            Overview: Übersicht
            Apply to a posting: Auf eine Anzeige bewerben
            Via a recruiter or an agency: Über Recruiter oder Agentur
            Career change and job search: Berufswechsel und Stellensuche
            Initiative application and Motivationsschreiben: Initiativbewerbung und Motivationsschreiben
            Keep your data and CVs current: Daten und Lebensläufe aktuell halten
            Skills: Skills
            Counterparts: Gegenpartei
            Glossary: Glossar
            Export: Export
            Optional MCP servers: Optionale MCP-Server
            LinkedIn: LinkedIn
            Handelsregister: Handelsregister
            Web search: Websuche
            JobSpy: JobSpy
            Browser MCP: Browser-MCP

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: en/index.md
  - Getting started: en/getting-started.md
  - Use cases:
      - Overview: en/use-cases/index.md
      - Apply to a posting: en/use-cases/posting-application.md
      - Via a recruiter or an agency: en/use-cases/recruiter.md
      - Career change and job search: en/use-cases/career-change.md
      - Initiative application and Motivationsschreiben: en/use-cases/initiative-and-motivation.md
      - Keep your data and CVs current: en/use-cases/maintain-and-variants.md
  - Skills: en/skills.md
  - Counterparts: en/counterparts.md
  - Glossary: en/glossary.md
  - Export: en/export.md
  - Optional MCP servers: en/mcp-servers.md
  - LinkedIn: en/linkedin.md
  - Handelsregister: en/handelsregister.md
  - Web search: en/websearch.md
  - JobSpy: en/jobspy.md
  - Browser MCP: en/browser.md
